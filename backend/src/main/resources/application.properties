spring.application.name=StudentDomainCRUD

# ===============================
# 1. DATABASE CONFIGURATION (OLD)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_project
spring.datasource.username=springuser
spring.datasource.password=Spring@2024
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# 2. OAUTH2 GOOGLE CONFIG (NEW)
# ===============================
# ? Yahan apna Google Client ID paste karein
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

# ? Yahan apna Google Client Secret paste karein
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Standard Google Settings (Inhein mat chhedna)
spring.security.oauth2.client.registration.google.scope=profile, email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ===============================
# 3. OTHER SETTINGS
# ===============================
server.port=8080

# Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
